name: Lint & Format Check

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            - name: Install npm dependencies
              run: npm ci

            - name: Install uv
              uses: astral-sh/setup-uv@v6

            - name: Install Python dependencies
              run: uv sync

            - name: ESLint
              run: npx eslint src/**/*.js

            - name: Stylelint
              run: npx stylelint src/**/*.css

            - name: HTMLHint
              run: npx htmlhint src/**/*.html

            - name: YAML Lint
              run: npx yaml-lint src/**/*.yaml

            - name: Prettier Check
              run: npx prettier --check .

            - name: Ruff Check
              run: uv run ruff check server.py

            - name: npm audit
              run: npm audit --audit-level=moderate
